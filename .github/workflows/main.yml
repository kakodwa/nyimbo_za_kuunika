
name: Nyimbo Za Kuunika Multi-Platform Build

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # ANDROID BUILD
  # ============================================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Set up Java JDK
      # --------------------------------------------------------
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------------
      # Set up Flutter
      # --------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          cache: true

      # --------------------------------------------------------
      # Get dependencies
      # --------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------------
      # Configure Android Release Signing
      # --------------------------------------------------------
      - name: Configure Android Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android signing secrets..."

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

          mkdir -p android/app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/kuunika-nyimbo-release.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=kuunika-nyimbo-release.jks
          EOF

          echo "Verifying release keystore..."

          keytool -list \
            -keystore android/app/kuunika-nyimbo-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          echo "Android release signing configured successfully."

      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------
      - name: Build APK
        run: flutter build apk --release

      # --------------------------------------------------------
      # Build AAB
      # --------------------------------------------------------
      - name: Build AAB
        run: flutter build appbundle --release

      # --------------------------------------------------------
      # Upload APK
      # --------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyimbo-za-kuunika-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # --------------------------------------------------------
      # Upload AAB
      # --------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nyimbo-za-kuunika-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7


  # ============================================================
  # iOS BUILD
  # ============================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Set up Flutter
      # --------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          cache: true

      # --------------------------------------------------------
      # Get dependencies
      # --------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------------
      # Import Apple certificate
      # --------------------------------------------------------
      - name: Install Apple certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "Decoding Apple certificate..."

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          echo "Checking certificate file..."
          ls -lh "$CERTIFICATE_PATH"
          file "$CERTIFICATE_PATH"

          echo "Testing PKCS12 certificate..."

          openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -info \
            -noout \
            -passin pass:"$IOS_CERTIFICATE_PASSWORD"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "temporary" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "temporary" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "temporary" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "Apple certificate imported successfully."

      # --------------------------------------------------------
      # Install provisioning profile
      # --------------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "Decoding provisioning profile..."

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          echo "Checking provisioning profile..."
          ls -lh "$PROFILE_PATH"
          file "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "Provisioning profile installed successfully."

      # --------------------------------------------------------
      # Check Xcode signing identities
      # --------------------------------------------------------
      - name: Check signing identities
        run: |
          echo "Available signing identities:"
          security find-identity -v -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # --------------------------------------------------------
      # Build signed IPA
      # --------------------------------------------------------
      - name: Build iOS IPA
        run: |
          flutter build ipa --release

      # --------------------------------------------------------
      # Check generated IPA
      # --------------------------------------------------------
      - name: Check IPA
        run: |
          echo "Generated IPA files:"
          ls -lh build/ios/ipa/

      # --------------------------------------------------------
      # Upload IPA
      # --------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nyimbo-za-kuunika-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
